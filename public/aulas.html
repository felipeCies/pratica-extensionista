<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aulas</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="img/icone.png" />
  </head>
  <body id="topo">
    <header class="header-aulas">
      <div class="header-aulas-top">
        <a href="menu.html" class="back-button">
          <img src="img/voltar_icone.png" alt="Voltar" />
        </a>

        <h1 id="aulaTitulo">Aulas</h1>

        <a class="search-button" id="abrirBusca">
          <img src="img/search_icon.png" alt="Buscar" />
        </a>
      </div>

      <div id="buscaWrapper" style="display: none">
        <input type="text" id="buscaAula" placeholder="Buscar aula..." class="input-busca" />
      </div>

      <div class="tabs">
          <a id="tabTodos" href="#" class="tab-button active" style="pointer-events: none;">Todos</a>
          <a id="tabFavoritos" href="#" class="tab-button">Favoritos</a>
      </div>
    </header>

    <main class="main-content-aulas">
      <div id="todosAulas" class="aula-list active"></div>
    </main>

    <footer class="custom-footer">
      <hr class="footer-divider" />
      <div class="footer-container">
        <p class="footer-text">
          &copy; Desenvolvido pelos alunos Felipe, Gabriel, Mauricio e Guilherme &middot;
        </p>
        <p><a href="#topo" class="footer-link">Voltar ao topo</a></p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script>
      const url = new URL(window.location.href);
      const courseId = url.searchParams.get("cursoId");

      
      if (courseId) {
          document.getElementById("tabFavoritos").href = `favoritos.html?cursoId=${courseId}`;
      }

      async function fetchLessonsByCourseId(courseId) {
        
        const lessonsListContainer = document.getElementById("todosAulas");

        if (!courseId) {
          lessonsListContainer.innerHTML = "<h3 style='text-align: center; margin-top: 50px;'>Nenhum curso selecionado! Volte para a página inicial.</h3>";
          return; 
        }

        try {
          const response = await fetch(`/api/lessons?course_id=${courseId}`);
          const lessons = await response.json();

          if (!Array.isArray(lessons) || lessons.length === 0) {
            lessonsListContainer.innerHTML = "<h3 style='text-align: center; margin-top: 50px;'>Nenhuma aula encontrada para este curso.</h3>";
            return;
          }

          lessons.forEach((lesson, index) => {
            const numeroAulaReal = index + 1; 

            const lessonContainer = document.createElement("a");
            lessonContainer.href = `aula.html?id=${lesson.id}`;
            lessonContainer.className = "aula-item";

            const thumb = document.createElement("div");
            thumb.className = "aula-thumb";

            const infoContainer = document.createElement("div");
            infoContainer.className = "aula-info";

            const lessonTitle = document.createElement("h3");
            lessonTitle.className = "aula-title";
            lessonTitle.innerHTML = `Aula ${numeroAulaReal}`; 

            const lessonDescription = document.createElement("p");
            lessonDescription.className = "aula-description";
            lessonDescription.innerHTML = lesson.titulo;

            const favBtn = document.createElement("button");
            favBtn.innerHTML = "🤍 Favoritar";
            favBtn.style.cssText = "margin-top: 10px; cursor: pointer; padding: 5px 10px; background: #eee; border: none; border-radius: 5px; font-weight: bold;";

            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            if (favoritos.some(fav => fav.id === lesson.id)) {
              favBtn.innerHTML = "⭐ Favoritado";
              favBtn.style.background = "#ffd700";
            }

            favBtn.onclick = (e) => {
              e.preventDefault(); 
              let favs = JSON.parse(localStorage.getItem("favoritos")) || [];
              const idx = favs.findIndex(f => f.id === lesson.id);

              if (idx > -1) {
                favs.splice(idx, 1);
                favBtn.innerHTML = "🤍 Favoritar";
                favBtn.style.background = "#eee";
              } else {
                favs.push({ 
                  id: lesson.id, 
                  titulo: lesson.titulo, 
                  courseId: courseId, 
                  numeroAula: numeroAulaReal 
                });
                favBtn.innerHTML = "⭐ Favoritado";
                favBtn.style.background = "#ffd700";
              }
              localStorage.setItem("favoritos", JSON.stringify(favs));
            };

            infoContainer.appendChild(lessonTitle);
            infoContainer.appendChild(lessonDescription);
            infoContainer.appendChild(favBtn); 

            lessonContainer.appendChild(thumb);
            lessonContainer.appendChild(infoContainer);

            lessonsListContainer.appendChild(lessonContainer);
          });
        } catch (error) {
          console.error("Erro ao buscar as aulas:", error);
          lessonsListContainer.innerHTML = "<h3 style='text-align: center; margin-top: 50px; color: red;'>Erro ao carregar as aulas.</h3>";
        }
      }

      fetchLessonsByCourseId(courseId);
    </script>
  </body>
</html>
